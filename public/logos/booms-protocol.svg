<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BSP Logo A: "Orbital Ledger" — gold orbit ring around a gold coin with navy B -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="#0B1026"/>
  <!-- orbit ring -->
  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="196" ry="84" fill="none" stroke="#E8B64C" stroke-width="14"/>
    <!-- small coin riding the orbit -->
    <circle cx="452" cy="256" r="24" fill="#E8B64C"/>
  </g>
  <!-- center coin -->
  <circle cx="256" cy="256" r="112" fill="#E8B64C"/>
  <!-- navy B -->
  <text x="256" y="258" text-anchor="middle" dominant-baseline="central"
        font-family="DejaVu Sans, Liberation Sans, sans-serif" font-weight="bold"
        font-size="150" fill="#0B1026">B</text>
</svg>
